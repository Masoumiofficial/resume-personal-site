name: Release package

# Builds the upload-ready package for shared hosting (no SSH/Composer needed on
# the host, D39): source from `git archive` (export-ignore rules in
# .gitattributes) + production-only vendor/ from composer.lock. The package is
# then booted the way the host will run it (APP_ENV=production, migrate,
# import, optimize, backup→restore) and the HTTP smoke test runs against it.
# On a v* tag the zip and its SHA-256 are published as a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The lowest supported version (D1/D2): the package must run on 8.3 and 8.4.
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, gd, curl, zip
          tools: composer:v2
          coverage: none

      - name: Assemble source and production dependencies
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="${VERSION}-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist/site
          git archive HEAD | tar -x -C dist/site
          cd dist/site
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          rm -f auth.json
          echo "${GITHUB_SHA}" > REVISION
          # Nothing generated by the build may be cached into the package.
          rm -f bootstrap/cache/*.php
          test ! -e .env
          for dev in tests docs tools design vendor/phpunit vendor/laravel/pint; do
            if [ -e "$dev" ]; then echo "::error::$dev must not be in the package"; exit 1; fi
          done

      - name: Zip
        run: |
          cd dist
          ZIP="sajadmasoumi-site-${{ steps.build.outputs.version }}.zip"
          zip -qr -X "$ZIP" site
          sha256sum "$ZIP" > "$ZIP.sha256"
          ls -la; cat "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Verify — boot the package like the host (production env)
        run: |
          set -o pipefail
          mkdir -p /tmp/verify && unzip -q "dist/$ZIP" -d /tmp/verify
          cd /tmp/verify/site
          cp .env.production.example .env
          sed -i \
            -e 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8080#' \
            -e 's#^ADMIN_PATH=.*#ADMIN_PATH=panel-ci#' \
            -e 's#^DB_CONNECTION=.*#DB_CONNECTION=sqlite#' \
            -e "s#^DB_DATABASE=.*#DB_DATABASE=$PWD/database/site.sqlite#" .env
          touch database/site.sqlite
          # Exactly what the host runs (one-off cron): first run installs, second is a no-op.
          php artisan app:deploy --admin-name=CI --admin-email=ci@example.com | tee /tmp/deploy1.txt
          grep -q "Import the reviewed site content" /tmp/deploy1.txt
          grep -q "APP_KEY" /tmp/deploy1.txt
          php artisan app:deploy | tee /tmp/deploy2.txt
          grep -q "already deployed" /tmp/deploy2.txt
          rm storage/app/private/initial-admin-password.txt   # fails the step if it was not created
          php artisan app:backup --media
          php artisan app:restore "$(ls storage/app/backups/db-*.jsonl.gz | head -1)" --force
          php artisan optimize
          php artisan app:check-production || echo "::notice title=check-production::Failures above are expected here (HTTP origin, SQLite); on the host every line must be OK."

      - name: Verify — HTTP smoke test against the package
        run: |
          cd /tmp/verify/site/public
          # Laravel's router script resolves index.php from the working directory.
          php -S 127.0.0.1:8080 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > /tmp/server.log 2>&1 &
          cd ..
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/up && break; sleep 0.5; done
          status=0
          php "$GITHUB_WORKSPACE/tools/smoke/smoke.php" http://127.0.0.1:8080 --admin-path=panel-ci --dev-server || status=$?
          if grep -hs "\.ERROR" storage/logs/*.log | head -5 | sed 's/^/::error title=Laravel log::/' | grep .; then exit 1; fi
          if [ "$status" != 0 ]; then grep -iE "fatal|error|warning" /tmp/server.log | head -5 | sed 's/^/::error title=php -S::/'; fi
          exit $status

      - name: Verify — split layout (web root outside the project, app-path.php + public-path.php)
        run: |
          set -o pipefail
          mkdir -p /tmp/split/www && cd /tmp/split
          unzip -q "$GITHUB_WORKSPACE/dist/$ZIP" && mv site project
          cp -a project/public/. www/ && rm -rf project/public
          cp /tmp/verify/site/.env project/.env
          cp /tmp/verify/site/database/site.sqlite project/database/site.sqlite
          sed -i -e "s#^DB_DATABASE=.*#DB_DATABASE=/tmp/split/project/database/site.sqlite#" -e "s#^APP_URL=.*#APP_URL=http://127.0.0.1:8081#" project/.env
          echo "<?php return '/tmp/split/project';" > www/app-path.php
          echo "<?php return '/tmp/split/www';" > project/bootstrap/public-path.php
          (cd project && php artisan optimize && { php artisan app:check-production > /tmp/split-full.txt || true; })
          grep -E "Web root|not inside|public/media" /tmp/split-full.txt | tee /tmp/split-check.txt
          test "$(wc -l < /tmp/split-check.txt)" -ge 4
          if grep -q "FAIL" /tmp/split-check.txt; then exit 1; fi
          cd www && php -S 127.0.0.1:8081 ../project/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > /tmp/server2.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8081/up && break; sleep 0.5; done
          php "$GITHUB_WORKSPACE/tools/smoke/smoke.php" http://127.0.0.1:8081 --admin-path=panel-ci --dev-server --skip-redirects > /tmp/smoke2.txt || { cat /tmp/smoke2.txt; exit 1; }
          tail -1 /tmp/smoke2.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-package
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          {
            echo "Upload-ready package for shared hosting (PHP 8.3/8.4, production vendor included)."
            echo
            echo "Deployment guide: docs/phase-6/deployment-guide.md"
            echo
            echo '```'; cat *.sha256; echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" *.zip *.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRE
