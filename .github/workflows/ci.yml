name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used by the "lock" job to commit a generated composer.lock

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Dependencies (composer.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Resolve dependencies
        id: resolve
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --no-progress --prefer-dist
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=composer.lock::No lock file in the repository; resolving with 'composer update'."
            composer update --no-interaction --no-progress --prefer-dist
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Security advisories (composer audit)
        run: composer audit --locked

      - name: Commit generated composer.lock
        if: steps.resolve.outputs.generated == 'true' && github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(deps): add composer.lock generated by CI"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning title=composer.lock::Could not push the lock file (branch moved?). It is still available as an artifact."

      - uses: actions/upload-artifact@v7
        with:
          name: composer-lock
          path: composer.lock

  pint:
    name: Code style (Pint)
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: composer-lock
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pint
        run: vendor/bin/pint --test || { echo "::error title=Pint::Code style issues. Run 'vendor/bin/pint' locally and commit the result."; exit 1; }

  tests-sqlite:
    name: Tests (PHP ${{ matrix.php }}, SQLite)
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: composer-lock
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Production caches build (config, routes, views)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear
      - name: PHPUnit
        run: vendor/bin/phpunit --log-junit junit.xml || { php .github/scripts/junit-annotate.php junit.xml "PHP ${{ matrix.php }} / SQLite"; exit 1; }

  tests-mysql:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.label }})
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            image: mariadb:10.3
            connection: mariadb
            label: MariaDB 10.3
          - php: '8.4'
            image: mysql:8.0
            connection: mysql
            label: MySQL 8.0
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: composer-lock
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, gd
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Server version
        run: mysql -h 127.0.0.1 -uroot -proot -e "SELECT VERSION();"
      - name: Migrate up, roll back, migrate again (real server)
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: PHPUnit
        run: vendor/bin/phpunit --log-junit junit.xml || { php .github/scripts/junit-annotate.php junit.xml "PHP ${{ matrix.php }} / ${{ matrix.label }}"; exit 1; }
